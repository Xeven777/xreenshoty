[package]
name = "tauri-native"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# `src/bin/dbcheck` is a read-only inspector for the screenshot DB. With two
# binaries cargo refuses to guess, and `tauri dev` runs `cargo run` bare.
default-run = "tauri-native"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenshots = "0.8"
dirs = "6"
chrono = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt", "time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
ureq = { version = "3.4.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
